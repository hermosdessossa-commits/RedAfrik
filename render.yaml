# -----------------------------------------------------------------------------
# Blueprint Render pour l'API RedAfrik (backend Django REST).
#
# Import dans Render : New > Blueprint > coller l'URL du dépôt GitHub.
# Puis compléter les variables marquées « sync: false » (panneau Services >
# Environment) : ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS, FRONTEND_URL,
# éventuellement EMAIL_* et DJANGO_LOG_LEVEL.
#
# Le frontend, lui, est déployé sur Vercel (voir vercel.json +
# scripts/vercel_build.sh) et pointe vers cette API via REDAFRIK_API_URL.
# -----------------------------------------------------------------------------

services:
  - type: web
    name: redafrik-api
    runtime: python
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: |
      python manage.py migrate --noinput
      gunicorn config.wsgi:application --workers 2 --threads 2 --timeout 60
    healthCheckPath: /api/sante/
    disk:
      name: redafrik-media
      mountPath: /var/lib/redafrik/media
      sizeGB: 1
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: redafrik-postgres
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/lib/redafrik/media
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "RedAfrik <no-reply@redafrik.app>"
      - key: EMAIL_BACKEND
        sync: false

databases:
  - name: redafrik-postgres
    databaseName: redafrik
    user: redafrik
    plan: free
