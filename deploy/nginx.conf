# Nginx — reverse proxy pour RedAfrik
#
# Installation :
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/redafrik
#   sudo ln -s /etc/nginx/sites-available/redafrik /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Gunicorn écoute sur 127.0.0.1:8001 ; nginx sert le HTTPS en frontal
# et les fichiers statiques, et reverse-proxy l'API et la SPA.

server {
    listen 80;
    server_name redafrik.example.org;

    # ---------------------------------------------------------- HTTP -> HTTPS
    # Si un certificat TLS est disponible, décommentez le bloc server 443 et
    # redirigez ici :  return 301 https://$host$request_uri;

    # Fichiers statiques collectés par `python manage.py collectstatic`
    # (STATIC_ROOT = <projet>/staticfiles, servi depuis /static/).
    location /static/ {
        alias /home/redafrik/RedAfrik/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Fichiers uploadés (avatars, bannières, images de posts) : Django ne les
    # sert qu'en DEBUG, nginx doit donc les servir en production.
    location /media/ {
        alias /home/redafrik/RedAfrik/media/;
        expires 30d;
    }

    # Taille maximale des corps de requêtes (images, posts)
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

