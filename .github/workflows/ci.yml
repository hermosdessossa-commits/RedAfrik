name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: redafrik
          POSTGRES_PASSWORD: redafrik
          POSTGRES_DB: redafrik
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U redafrik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          sed -i "s/^DB_PORT=.*/DB_PORT=5433/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=redafrik/" .env
          python manage.py check

      - name: Migrations
        run: python manage.py migrate

      - name: Tests d'intégration
        run: python manage.py test tests --settings=config.settings_test

      - name: Couverture
        run: |
          coverage run --source=apps,config,core manage.py test tests --settings=config.settings_test
          coverage report --fail-under=65