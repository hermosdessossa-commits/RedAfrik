<!DOCTYPE html>
<html lang="fr" data-theme="sombre">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RedAfrik — la plateforme communautaire de la diaspora africaine : communautés, partages et débats.">
  <meta name="robots" content="index, follow">
  <title>RedAfrik</title>
  <link rel="icon" href="/static/frontend/img/favicon.png">
  <link rel="stylesheet" href="/static/frontend/css/style.css">
</head>
<body>

  <!-- Barre supérieure -->
  <header class="barre-haut">
    <button id="btn-menu" class="bouton icone" aria-label="Ouvrir le menu" title="Menu">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
    </button>

    <a class="logo" href="#/" aria-label="RedAfrik — accueil">
      <img class="logo-badge logo-img" src="/static/frontend/img/logo.png" width="34" height="34" alt="RedAfrik">
      <span class="logo-nom">Red<span class="logo-afrik">Afrik</span></span>
    </a>

    <form id="form-recherche" class="recherche" role="search" autocomplete="off">
      <svg class="recherche-icone" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="champ-recherche" type="search" placeholder="Rechercher dans RedAfrik" aria-label="Rechercher">
    </form>

    <button id="btn-theme" class="bouton icone" aria-label="Changer de thème" title="Changer de thème">
      <svg id="icone-soleil" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1zM4.22 4.22a1 1 0 0 1 1.41 0l1.42 1.42a1 1 0 1 1-1.42 1.41L4.22 5.64a1 1 0 0 1 0-1.42zm15.56 0a1 1 0 0 1 0 1.42l-1.42 1.42a1 1 0 1 1-1.41-1.42l1.42-1.41a1 1 0 0 1 1.41 0zM12 20a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1zm-8 0a1 1 0 0 1 0-1.42l1.42-1.41a1 1 0 1 1 1.41 1.41l-1.41 1.42A1 1 0 0 1 4 20zm16 0a1 1 0 0 1-.71.29 1 1 0 0 1-.71-.29l-1.41-1.42a1 1 0 1 1 1.41-1.41L20.3 19.2a1 1 0 0 1-.3 1.71zm-8-4a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg>
      <svg id="icone-lune" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" hidden><path d="M21.4 13.4A9.5 9.5 0 0 1 10.6 2.6a1 1 0 0 0-1.3-1.2A10.5 10.5 0 1 0 22.6 14.7a1 1 0 0 0-1.2-1.3z"/></svg>
    </button>

    <div id="zone-actions" class="actions" aria-label="Actions du compte"></div>
  </header>

  <div id="voile" class="voile" hidden></div>

  <!-- Disposition principale -->
  <div class="grille">
    <aside id="sidebar" class="sidebar" aria-label="Navigation">
      <nav class="nav-principale">
        <a class="lien-nav actif" href="#/" data-nom="accueil">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg>
          Accueil
        </a>
        <a class="lien-nav" href="#/populaire" data-nom="populaire">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2 20h2v-9H2v9zm4-9v9h2v-9H6zm4 0v9h2v-9h-2zm4-9v18h2V2h-2zm4 9v9h2v-9h-2z"/></svg>
          Populaire
        </a>
        <a class="lien-nav" href="#/tendances" data-nom="tendances">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M7 5h10v2H7zM4 11h16v2H4zM2 17h20v2H2z"/></svg>
          Tendances
        </a>
        <a class="lien-nav" href="#/abonnements" data-nom="abonnements">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 21.35 10.55 20.03C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09A5.99 5.99 0 0 1 16.5 3C19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          Mes abonnements
        </a>
      </nav>

      <div class="sidebar-section">
        <div class="sidebar-titre">Communautés</div>
        <div id="liste-communautes" class="liste-communautes"></div>
      </div>

      <button id="btn-nouvelle-communaute" class="bouton bouton-principal bouton-plein">
        + Nouvelle communauté
      </button>
    </aside>

    <main id="contenu" class="contenu" tabindex="-1"></main>
  </div>

  <!-- Conteneur des modales -->
  <div id="modales"></div>

  <!-- Notifications -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/static/frontend/js/config.js"></script>
  <script src="/static/frontend/js/app.js"></script>
</body>
</html>
